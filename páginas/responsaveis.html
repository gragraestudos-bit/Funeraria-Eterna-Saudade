<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Responsáveis - Funerária Eterna Saudade</title>
    <link rel="stylesheet" href="../css/responsaveis.css">
</head>

<body>
    <header>
        <div>
            <h1><a href="../index.html">Funerária Eterna Saudade</a></h1>
            <p>Cadastro de familiares responsáveis</p>
        </div>
        <a href="./sistema.html">
            <button id="botaoSair">
                Sair
            </button>
        </a>
    </header>
    </header>


    <main>
        <section class="formulario">
            <h2>Cadastro de Familiar Responsável</h2>

            <form id="responsavelForm">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite o nome completo" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>

                <label for="parentesco">Grau de parentesco</label>

                <select id="parentesco" required>
                    <option value="">
                        Selecione
                    </option>

                    <option value="Filho(a)">
                        Filho(a)
                    </option>

                    <option value="Pai">
                        Pai
                    </option>

                    <option value="Mãe">
                        Mãe
                    </option>

                    <option value="Irmão(ã)">
                        Irmão(ã)
                    </option>

                    <option value="Cônjuge">
                        Cônjuge
                    </option>

                    <option value="Avô/Avó">
                        Avô/Avó
                    </option>

                    <option value="Neto(a)">
                        Neto(a)
                    </option>

                    <option value="Outro">
                        Outro
                    </option>
                </select>

                <label for="falecido">Falecido relacionado</label>

                <select id="falecido" required>
                    <option value="">
                        Selecione o falecido
                    </option>
                </select>

                <button type="submit">
                    Cadastrar responsável
                </button>
            </form>

            <p id="mensagem"></p>
        </section>

        <section class="lista">
            <h2>
                Familiares responsáveis cadastrados
            </h2>

            <div id="listaResponsaveis">
                <p>
                    Nenhum responsável cadastrado.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>
            Funerária Eterna Saudade
        </p>
    </footer>

    <script src="../javascript/responsaveis.js"></script>
</body>
</html>
