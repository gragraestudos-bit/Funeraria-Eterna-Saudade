<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Falecido - Funerária Eterna Saudade</title>

    <link rel="stylesheet" href="../css/falecidos.css">
</head>

<body>
    <header>
        <div>
            <h1><a href="../index.html">Funerária Eterna Saudade</a></h1>
            <p>Cadastro de Falecido</p>
        </div>
        <a href="./sistema.html">
            <button id="botaoSair">
                Sair
            </button>
        </a>
    </header>


    <main>
        <section class="formulario">
            <h2>Cadastro de Falecido</h2>
            <form id="falecidoForm">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite o nome completo" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" required>

                <label for="falecimento">Data de falecimento</label>
                <input type="date" id="falecimento" required>

                <label for="sexo">Sexo</label>
                <select id="sexo" required>
                    <option value="">
                        Selecione
                    </option>

                    <option value="Feminino">
                        Feminino
                    </option>

                    <option value="Masculino">
                        Masculino
                    </option>

                    <option value="Outro">
                        Outro
                    </option>
                </select>


                <label for="observacoes">Observações</label>
                <textarea id="observacoes" rows="4" placeholder="Digite alguma observação, se necessário" ></textarea>

                <button type="submit">
                    Cadastrar falecido
                </button>
            </form>

            <p id="mensagem"></p>
        </section>
    </main>


    <div class="lista">
        <h2>
            Falecidos cadastrados
        </h2>

        <div id="listaFalecidos">
            <p>
                Nenhum falecido cadastrado.
            </p>
        </div>
    </div>

    <footer>
        <p>
            Funerária Eterna Saudade
        </p>
    </footer>


    <script src="../javascript/falecido.js"></script>
</body>
</html>
